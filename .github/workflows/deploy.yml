name: Deploy Vite App to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build the app
        run: npm run build

      - name: Prepare static HTML
        run: |
          cp index.html dist/client/index.html
          JS_FILE=$(ls dist/client/assets/index-*.js | head -n 1 | xargs basename)
          CSS_FILE=$(ls dist/client/assets/styles-*.css | head -n 1 | xargs basename)
          sed -i "s|/src/index.tsx|/assets/$JS_FILE|g" dist/client/index.html
          sed -i "s|</head>|<link rel=\"stylesheet\" href=\"/assets/$CSS_FILE\">\n</head>|g" dist/client/index.html
          cp dist/client/index.html dist/client/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/client'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
